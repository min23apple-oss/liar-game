<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワールドウルフ</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 15px;
        }
        .container {
            background-color: white; padding: 25px 20px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
            width: 100%; max-width: 400px;
        }
        h1 { color: #222; margin-bottom: 20px; font-size: 24px; }
        input, select {
            width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #e1e4e8;
            border-radius: 10px; font-size: 16px; text-align: center; outline: none;
            background-color: white;
        }
        .btn {
            width: 100%; background-color: #4CAF50; color: white; border: none;
            padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px;
            cursor: pointer; margin: 8px 0;
        }
        .btn-secondary { background-color: #008CBA; }
        .btn-danger { background-color: #e74c3c; }
        .btn-select {
            background-color: #ffffff; color: #333; border: 2px solid #4CAF50;
            padding: 12px; margin: 6px 0; font-size: 16px; border-radius: 10px;
            cursor: pointer; width: 100%; font-weight: bold;
        }
        .btn-select:active { background-color: #e8f5e9; }
        .card { background-color: #f8f9fa; border: 2px dashed #4CAF50; padding: 25px 15px; border-radius: 15px; margin: 20px 0; }
        .word { font-size: 24px; font-weight: bold; color: #e74c3c; margin-top: 15px; }
        .result-box { font-size: 20px; font-weight: bold; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .result-correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result-wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hidden { display: none; }
        ul { list-style: none; padding: 0; margin: 15px 0; }
        li { padding: 12px; background: #f1f3f5; margin: 6px 0; border-radius: 8px; font-weight: 500; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
        label { font-weight: bold; display: block; margin-top: 15px; text-align: left; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤡 ワールドウルフ</h1>

    <!-- 1. 로그인/방 입장 화면 -->
    <div id="login-screen">
        <input type="text" id="nickname-input" placeholder="名前を書いてください"><br>
        <button class="btn" onclick="createRoom()">部屋を作る</button>
        <hr>
        <input type="text" id="room-id-input" placeholder="部屋コード"><br>
        <button class="btn btn-secondary" onclick="joinRoom()">部屋に参加する</button>
    </div>

    <!-- 2. 대기실 화면 -->
    <div id="lobby-screen" class="hidden">
        <h2>部屋コード: <span id="display-room-id" style="color: #e74c3c;"></span></h2>
        
        <!-- 방장 전용 카테고리 선택 창 -->
        <div id="category-select-box" class="hidden">
            <label for="category-select">📌 カテゴリー選択:</label>
            <select id="category-select"></select>
        </div>

        <h3>参加人数 (<span id="player-count">0</span>/6)</h3>
        <ul id="player-list"></ul>
        <button id="start-btn" class="btn hidden" onclick="startGame()">スタート！</button>
        <p id="wait-msg" style="color: #666;">ちょっと待ってください...</p>
    </div>

    <!-- 3. 게임 진행 화면 -->
    <div id="game-screen" class="hidden">
        <h2>ゲーム中</h2>
        <div class="card">
            <p>カテゴリー: <strong id="display-category"></strong></p>
            <div id="display-word" class="word"></div>
        </div>
        <p style="color: #888; font-size: 14px;">自分の単語を説明しましょう！</p>
        <button id="host-end-btn" class="btn btn-danger hidden" onclick="requestVoteScreen()">ゲーム終わり、ウルフ選択</button>
    </div>

    <!-- 4. 투표 및 지목 화면 -->
    <div id="vote-screen" class="hidden">
        <h2>ウルフは誰？</h2>
        <div id="host-vote-section" class="hidden">
            <p>ウルフを選んでください！</p>
            <div id="candidate-list"></div>
        </div>
        <div id="guest-vote-section" class="hidden">
            <p>ちょっと待ってください！</p>
        </div>
    </div>

    <!-- 5. 결과 화면 -->
    <div id="result-screen" class="hidden">
        <h2>結果</h2>
        <div id="result-message" class="result-box"></div>
        
        <button id="restart-btn" class="btn hidden" onclick="restartGame()">新しいゲーム</button>
        <button id="retry-vote-btn" class="btn btn-secondary hidden" onclick="backToVoteScreen()">他の人を選んでください！</button>
    </div>
</div>

<script>
    let currentRoomId = '';
    let myNickname = '';
    let amIHost = false;
    const socket = io();

    function createRoom() {
        myNickname = document.getElementById('nickname-input').value.trim();
        if (!myNickname) return alert('닉네임을 입력하세요.');
        socket.emit('createRoom', { nickname: myNickname });
    }

    function joinRoom() {
        myNickname = document.getElementById('nickname-input').value.trim();
        const roomId = document.getElementById('room-id-input').value.trim();
        if (!myNickname || !roomId) return alert('닉네임과 방 코드를 입력하세요.');
        socket.emit('joinRoom', { roomId, nickname: myNickname });
    }

    function startGame() { 
        const selectedCategory = document.getElementById('category-select').value;
        socket.emit('startGame', { roomId: currentRoomId, selectedCategory }); 
    }

    function requestVoteScreen() { socket.emit('requestVoteScreen', currentRoomId); }
    function restartGame() { socket.emit('restartGame', currentRoomId); }

    function selectCandidate(candidateId) {
        socket.emit('selectLiarCandidate', { roomId: currentRoomId, candidateId });
    }

    function backToVoteScreen() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('vote-screen').classList.remove('hidden');
    }

    // 카테고리 셀렉트박스 채우기
    function setupCategories(categories) {
        const select = document.getElementById('category-select');
        select.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });
    }

    socket.on('roomCreated', ({ roomId, isHost, categories }) => {
        currentRoomId = roomId;
        amIHost = isHost;
        setupCategories(categories);
        showLobby(roomId);
    });

    socket.on('joinedRoom', ({ roomId, isHost, categories }) => {
        currentRoomId = roomId;
        amIHost = isHost;
        setupCategories(categories);
        showLobby(roomId);
    });

    socket.on('updatePlayers', (players) => {
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        players.forEach(p => {
            const li = document.createElement('li');
            li.innerText = p.nickname;
            list.appendChild(li);
        });
        document.getElementById('player-count').innerText = players.length;
    });

    socket.on('gameStarted', (data) => {
        hideAllScreens();
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('display-category').innerText = data.category;
        
        // 바보모드: 누구에게나 단어가 자연스럽게 표시됩니다!
        document.getElementById('display-word').innerText = `単語: ${data.word}`;

        if (data.isHost) {
            document.getElementById('host-end-btn').classList.remove('hidden');
        } else {
            document.getElementById('host-end-btn').classList.add('hidden');
        }
    });

    socket.on('showVoteScreen', ({ players }) => {
        hideAllScreens();
        document.getElementById('vote-screen').classList.remove('hidden');

        if (amIHost) {
            document.getElementById('host-vote-section').classList.remove('hidden');
            document.getElementById('guest-vote-section').classList.add('hidden');
            
            const listDiv = document.getElementById('candidate-list');
            listDiv.innerHTML = '';
            players.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn-select';
                btn.innerText = p.nickname;
                btn.onclick = () => selectCandidate(p.id);
                listDiv.appendChild(btn);
            });
        } else {
            document.getElementById('host-vote-section').classList.add('hidden');
            document.getElementById('guest-vote-section').classList.remove('hidden');
        }
    });

    socket.on('voteResult', ({ candidateName, isCorrect }) => {
        hideAllScreens();
        document.getElementById('result-screen').classList.remove('hidden');

        const msgDiv = document.getElementById('result-message');
        const restartBtn = document.getElementById('restart-btn');
        const retryBtn = document.getElementById('retry-vote-btn');

        restartBtn.classList.add('hidden');
        retryBtn.classList.add('hidden');

        if (isCorrect) {
            msgDiv.className = 'result-box result-correct';
            msgDiv.innerText = `🎉 ${candidateName}はウルフです！`;
            if (amIHost) restartBtn.classList.remove('hidden');
        } else {
            msgDiv.className = 'result-box result-wrong';
            msgDiv.innerText = `❌ ${candidateName}はウルフじゃないです！`;
            if (amIHost) retryBtn.classList.remove('hidden');
        }
    });

    socket.on('returnToLobby', () => {
        hideAllScreens();
        document.getElementById('lobby-screen').classList.remove('hidden');
    });

    socket.on('errorMsg', (msg) => alert(msg));

    function showLobby(roomId) {
        hideAllScreens();
        document.getElementById('lobby-screen').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = roomId;

        if (amIHost) {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('category-select-box').classList.remove('hidden');
            document.getElementById('wait-msg').classList.add('hidden');
        } else {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('category-select-box').classList.add('hidden');
            document.getElementById('wait-msg').classList.remove('hidden');
        }
    }

    function hideAllScreens() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('vote-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
    }
</script>

</body>
</html>
